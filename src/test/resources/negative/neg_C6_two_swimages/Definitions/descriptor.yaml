# Violates: SOL001 V5.4.1 clause 6.8.12.6 - one artifact of type tosca.artifacts.nfv.SwImage,
# not two. Clause 6.8.12.6 also makes the node template name the id of the SwImageDesc, so two
# images on one container would need one identifier to name both.
#
# Expected: exactly one ERROR, C6.

tosca_definitions_version: tosca_simple_yaml_1_3

description: A Vdu.OsContainer with two SwImage artifacts

imports:
  - etsi_nfv_sol001_vnfd_types.yaml

node_types:
  ExampleCorp.NegC6b.1_0:
    derived_from: tosca.nodes.nfv.VNF
    properties:
      descriptor_id:
        type: string
        default: 10000000-0000-4000-8000-000000000062
      provider:
        type: string
        default: ExampleCorp
      product_name:
        type: string
        default: NegC6b
      software_version:
        type: string
        default: '1.0'
      descriptor_version:
        type: string
        default: '1.0'
      flavour_id:
        type: string
        default: default
      flavour_description:
        type: string
        default: "A Vdu.OsContainer with two SwImage artifacts"
      vnfm_info:
        type: list
        entry_schema:
          type: string
        default: [ '0:ExampleCorp-1.0.0' ]

topology_template:

  node_templates:

    VNF:
      type: ExampleCorp.NegC6b.1_0

    AppVdu:
      type: tosca.nodes.nfv.Vdu.OsContainerDeployableUnit
      properties:
        name: app-vdu
        description: "Application tier"
        vdu_profile:
          min_number_of_instances: 1
          max_number_of_instances: 3
        mcio_identification_data:
          name: neg-app
          type: Deployment
      requirements:
        - container: AppContainer

    AppContainer:
      type: tosca.nodes.nfv.Vdu.OsContainer
      properties:
        name: app
        description: "Application container"
        requested_cpu_resources: 200
        requested_memory_resources: 256 MiB
      artifacts:
        sw_image:
          type: tosca.artifacts.nfv.SwImage
          file: ../Artifacts/Images/README.txt
          properties:
            name: neg-app
            version: '1.0'
            container_format: docker
        sw_image_backup:
          type: tosca.artifacts.nfv.SwImage
          file: ../Artifacts/Images/README.txt
          properties:
            name: neg-app-backup
            version: '0.9'
            container_format: docker

    AppCp:
      type: tosca.nodes.nfv.VduCp
      properties:
        layer_protocols: [ ipv4 ]
      requirements:
        - virtual_binding: AppVdu
