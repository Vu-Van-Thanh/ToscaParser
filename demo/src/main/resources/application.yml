server:
  port: 8080

spring:
  application:
    name: etsi-vnfd-parser-demo
  jackson:
    # The VNFD is rendered by VnfdJson, which builds the tree by hand; this only affects how Spring
    # writes that tree back out.
    default-property-inclusion: non_null

logging:
  level:
    com.example.etsi.vnfd: DEBUG
