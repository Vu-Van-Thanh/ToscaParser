# Violates: IFA011 V5.4.1 clause 7.1.8.2.2 - defaultInstantiationLevelId "shall be present if
# there are multiple instantiationLevel entries". SOL001 clause 6.10.1 says the same of
# default_level: "required if multiple entries in levels".
#
# With two levels and no default, nothing says which one an instantiation without an explicit level
# should use.
#
# Expected: exactly one ERROR, C12.

tosca_definitions_version: tosca_simple_yaml_1_3

description: Two instantiation levels and no default among them

imports:
  - etsi_nfv_sol001_vnfd_types.yaml

node_types:
  ExampleCorp.NegC12.1_0:
    derived_from: tosca.nodes.nfv.VNF
    properties:
      descriptor_id:
        type: string
        default: 10000000-0000-4000-8000-000000000012
      provider:
        type: string
        default: ExampleCorp
      product_name:
        type: string
        default: NegC12
      software_version:
        type: string
        default: '1.0'
      descriptor_version:
        type: string
        default: '1.0'
      flavour_id:
        type: string
        default: default
      flavour_description:
        type: string
        default: "Two instantiation levels and no default among them"
      vnfm_info:
        type: list
        entry_schema:
          type: string
        default: [ '0:ExampleCorp-1.0.0' ]

topology_template:

  node_templates:

    VNF:
      type: ExampleCorp.NegC12.1_0

    AppVdu:
      type: tosca.nodes.nfv.Vdu.OsContainerDeployableUnit
      properties:
        name: app-vdu
        description: "Application tier"
        vdu_profile:
          min_number_of_instances: 1
          max_number_of_instances: 3
        mcio_identification_data:
          name: neg-app
          type: Deployment
      requirements:
        - container: AppContainer

    AppContainer:
      type: tosca.nodes.nfv.Vdu.OsContainer
      properties:
        name: app
        description: "Application container"
        requested_cpu_resources: 200
        requested_memory_resources: 256 MiB
      artifacts:
        sw_image:
          type: tosca.artifacts.nfv.SwImage
          file: ../Artifacts/Images/README.txt
          properties:
            name: neg-app
            version: '1.0'
            container_format: docker

    AppCp:
      type: tosca.nodes.nfv.VduCp
      properties:
        layer_protocols: [ ipv4 ]
      requirements:
        - virtual_binding: AppVdu

  policies:

    - instantiation_levels:
        type: tosca.policies.nfv.InstantiationLevels
        properties:
          levels:
            small:
              description: "Entry footprint"
            large:
              description: "Scaled out"

    - app_instantiation_levels:
        type: tosca.policies.nfv.VduInstantiationLevels
        properties:
          levels:
            small:
              number_of_instances: 1
            large:
              number_of_instances: 3
        targets: [ AppVdu ]
