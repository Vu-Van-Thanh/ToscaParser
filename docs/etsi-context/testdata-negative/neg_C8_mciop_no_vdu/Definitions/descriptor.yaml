# Violates: SOL001 V5.4.1 clause 6.8.14.6 - the associatedVdu requirement has occurrences
# [1, UNBOUNDED], so at least one is required. An MCIOP nothing is associated with describes a
# workload the VNFD cannot attribute to any VDU.
#
# The VDU here declares its own container, so it is realized MCIO by MCIO and rule C2 stays silent.
#
# Expected: exactly one ERROR, C8.

tosca_definitions_version: tosca_simple_yaml_1_3

description: An Mciop associated with no VDU

imports:
  - etsi_nfv_sol001_vnfd_types.yaml

node_types:
  ExampleCorp.NegC8.1_0:
    derived_from: tosca.nodes.nfv.VNF
    properties:
      descriptor_id:
        type: string
        default: 10000000-0000-4000-8000-000000000008
      provider:
        type: string
        default: ExampleCorp
      product_name:
        type: string
        default: NegC8
      software_version:
        type: string
        default: '1.0'
      descriptor_version:
        type: string
        default: '1.0'
      flavour_id:
        type: string
        default: default
      flavour_description:
        type: string
        default: "An Mciop associated with no VDU"
      vnfm_info:
        type: list
        entry_schema:
          type: string
        default: [ '0:ExampleCorp-1.0.0' ]

topology_template:

  node_templates:

    VNF:
      type: ExampleCorp.NegC8.1_0

    AppVdu:
      type: tosca.nodes.nfv.Vdu.OsContainerDeployableUnit
      properties:
        name: app-vdu
        description: "Application tier"
        vdu_profile:
          min_number_of_instances: 1
          max_number_of_instances: 3
        mcio_identification_data:
          name: neg-app
          type: Deployment
      requirements:
        - container: AppContainer

    AppContainer:
      type: tosca.nodes.nfv.Vdu.OsContainer
      properties:
        name: app
        description: "Application container"
        requested_cpu_resources: 200
        requested_memory_resources: 256 MiB
      artifacts:
        sw_image:
          type: tosca.artifacts.nfv.SwImage
          file: ../Artifacts/Images/README.txt
          properties:
            name: neg-app
            version: '1.0'
            container_format: docker

    orphan_mciop:
      type: tosca.nodes.nfv.Mciop
      artifacts:
        orphan_chart:
          type: tosca.artifacts.nfv.HelmChart
          file: ../Artifacts/Charts/orphan.tgz

    AppCp:
      type: tosca.nodes.nfv.VduCp
      properties:
        layer_protocols: [ ipv4 ]
      requirements:
        - virtual_binding: AppVdu
