# Violates: nothing ETSI states directly - this is [PROJECT-SPECIFIC].
#
# SOL004 V5.1.1 clause 4.1.2.1 has artifacts "pointed to by relative path names through artifact
# definitions in one of the TOSCA definitions files", but defines no resolution algorithm and so
# says nothing about a path that climbs out of the archive.
#
# A VNF package is third-party content and its author controls these paths, so a descriptor can ask
# for ../../../../etc/passwd. Resolution refuses rather than reading outside the package.
#
# Expected: the parse FAILS with CsarSecurityException - this is a structural refusal, not a
# finding, because the alternative is to read a file the package has no business naming.

tosca_definitions_version: tosca_simple_yaml_1_3

description: An artifact path escaping the package root

imports:
  - etsi_nfv_sol001_vnfd_types.yaml

node_types:
  ExampleCorp.NegZipSlip.1_0:
    derived_from: tosca.nodes.nfv.VNF
    properties:
      descriptor_id:
        type: string
        default: 10000000-0000-4000-8000-0000000000ff
      provider:
        type: string
        default: ExampleCorp
      product_name:
        type: string
        default: NegZipSlip
      software_version:
        type: string
        default: '1.0'
      descriptor_version:
        type: string
        default: '1.0'
      flavour_id:
        type: string
        default: default
      flavour_description:
        type: string
        default: "An artifact path escaping the package root"
      vnfm_info:
        type: list
        entry_schema:
          type: string
        default: [ '0:ExampleCorp-1.0.0' ]

topology_template:

  node_templates:

    VNF:
      type: ExampleCorp.NegZipSlip.1_0

    AppVdu:
      type: tosca.nodes.nfv.Vdu.OsContainerDeployableUnit
      properties:
        name: app-vdu
        description: "Application tier"
        vdu_profile:
          min_number_of_instances: 1
          max_number_of_instances: 3
        mcio_identification_data:
          name: neg-app
          type: Deployment
      requirements:
        - container: AppContainer

    AppContainer:
      type: tosca.nodes.nfv.Vdu.OsContainer
      properties:
        name: app
        description: "Application container whose image escapes the package"
        requested_cpu_resources: 200
        requested_memory_resources: 256 MiB
      artifacts:
        sw_image:
          type: tosca.artifacts.nfv.SwImage
          file: ../../../../etc/passwd
          properties:
            name: neg-app
            version: '1.0'
            container_format: docker

    AppCp:
      type: tosca.nodes.nfv.VduCp
      properties:
        layer_protocols: [ ipv4 ]
      requirements:
        - virtual_binding: AppVdu
