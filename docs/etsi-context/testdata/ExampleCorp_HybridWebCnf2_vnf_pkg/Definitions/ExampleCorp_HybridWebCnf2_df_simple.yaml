# Single deployment flavour design with one service template,
# ETSI GS NFV-SOL 001 V5.4.1 clause 6.11.3.
#
# This is the "hybrid" design in the sense that matters: ONE deployment flavour holding TWO VDUs
# that are realized by different means.
#
#   CacheVdu   no `container` requirement  -> realized from an MCIOP (cache_mciop), SOL001 Annex A.23
#   WebVdu     requirements: [container: WebContainer] -> realized MCIO by MCIO, SOL001 Annex A.18
#
# [ETSI NORMATIVE] IFA011 V5.4.1 clause 7.1.6.2.2 Note 10 is stated per VDU: with osContainerDesc
# absent, "the MciopProfile associated with the VDU shall be present". Nothing in IFA011 requires
# every VDU of one flavour to be realized the same way, and IFA011 clause 7.1.8.2.2 makes
# mciopProfile 0..N, required "if the DF references (via the vduProfile) containerized workloads
# based on a MCIOP" - a condition about the flavour referencing such a workload, not about all of
# them being one.
#
# [TOSCA REPRESENTATION] Node types used, with their SOL001 V5.4.1 clauses:
#   tosca.nodes.nfv.VNF                            6.8.1
#   tosca.nodes.nfv.Vdu.OsContainerDeployableUnit  6.8.13
#   tosca.nodes.nfv.Vdu.OsContainer                6.8.12
#   tosca.nodes.nfv.Mciop                          6.8.14
#   tosca.nodes.nfv.VduCp                          6.8.8
#   tosca.artifacts.nfv.SwImage                    6.3.1
#   tosca.artifacts.nfv.HelmChart                  6.3.3
#   tosca.artifacts.nfv.HelmParamMappingScript     6.3.4
#   tosca.artifacts.nfv.HelmParamMappingRule       6.3.5
#
# Structural signature a parser must reproduce:
#   mciopProfile[].associatedVdu  is a PROPER SUBSET of  vduProfile[].vduId
#   df[0] holds two different lcmRealizationPath values at once

tosca_definitions_version: tosca_simple_yaml_1_3

description: >-
  VNFD for the ExampleCorp HybridWebCnf2 VNF. One deployment flavour "simple" holding a
  cache tier realized from a Helm chart (MCIOP) and a web tier realized as an OS container
  described in the VNFD itself.

imports:
  # [ETSI NORMATIVE] SOL001 V5.4.1 Annex B.2 NOTE 2: the type definitions file "may, but need not,
  # be included in the VNF Package". It is referenced but not shipped; a consumer supplies it.
  - etsi_nfv_sol001_vnfd_types.yaml

node_types:
  # [ETSI NORMATIVE] SOL001 V5.4.1 clause 6.11.2 requires the VNF node type to be VNF-specific and
  # derived from tosca.nodes.nfv.VNF, which is why a parser cannot classify by type name.
  ExampleCorp.HybridWebCnf2.1_0:
    derived_from: tosca.nodes.nfv.VNF
    properties:
      descriptor_id:
        type: string
        default: 3c1f7a90-5d2b-4e88-9f31-0a6d4b2e7c15
      provider:
        type: string
        default: ExampleCorp
      product_name:
        type: string
        default: HybridWebCnf2
      software_version:
        type: string
        default: '1.0'
      descriptor_version:
        type: string
        default: '1.0'
      flavour_id:
        type: string
        default: simple
      flavour_description:
        type: string
        default: "Cache tier via MCIOP, web tier via OsContainer, in one flavour"
      vnfm_info:
        type: list
        entry_schema:
          type: string
        # Matches the pattern the ETSI type declares for vnfm_info, unlike the three older fixtures.
        default: [ '0:ExampleCorp-1.0.0' ]
    requirements:
      - virtual_link_mgmt:
          capability: tosca.capabilities.nfv.VirtualLinkable
          relationship: tosca.relationships.nfv.VirtualLinksTo
          occurrences: [ 0, 1 ]

topology_template:

  substitution_mappings:
    node_type: ExampleCorp.HybridWebCnf2.1_0
    requirements:
      # SOL001 clause 6.8.2.8: exposing a VduCp here makes it an external connection point as well.
      virtual_link_mgmt: [ WebCp, virtual_link ]

  node_templates:

    VNF:
      type: ExampleCorp.HybridWebCnf2.1_0
      properties:
        flavour_id: simple
        flavour_description: "Cache tier via MCIOP, web tier via OsContainer, in one flavour"

    # ---------------------------------------------------------------- cache tier: MCIOP realized
    #
    # No `container` requirement. IFA011 clause 7.1.6.2.2 Note 10 therefore requires an associated
    # MciopProfile, which cache_mciop below supplies.
    CacheVdu:
      type: tosca.nodes.nfv.Vdu.OsContainerDeployableUnit
      properties:
        name: cache-vdu
        description: "Redis cache tier, deployed from a Helm chart"
        vdu_profile:
          min_number_of_instances: 1
          max_number_of_instances: 3
        mcio_identification_data:
          # [ETSI NORMATIVE] SOL001 clause 6.2.75: both properties are required:true and `type` is
          # constrained to Deployment | StatefulSet | DaemonSet.
          name: hybrid-web-cnf2-cache
          type: StatefulSet
        is_num_of_instances_cluster_based: false

    cache_mciop:
      type: tosca.nodes.nfv.Mciop
      # [ETSI NORMATIVE] SOL001 clause 6.8.14.2 Properties: None. An Mciop carries artifacts and
      # requirements only; everything profiled about it lives in the MciopProfile of IFA011.
      requirements:
        - associatedVdu: CacheVdu
      artifacts:
        cache_helm_chart:
          description: Helm chart realizing the CacheVdu MCIO
          type: tosca.artifacts.nfv.HelmChart
          file: ../Artifacts/Charts/hybrid-web-cnf2-cache-1.0.0.tgz
        cache_param_mapping_script:
          description: >-
            Produces the Helm values for cache_mciop from the VNF LCM operation request.
          type: tosca.artifacts.nfv.HelmParamMappingScript
          file: ../Artifacts/Scripts/cache_param_mapping.sh
          properties:
            language: bash
        cache_param_mapping_rule:
          description: Rules interpreted by cache_param_mapping_script
          type: tosca.artifacts.nfv.HelmParamMappingRule
          file: ../Artifacts/Scripts/cache_param_mapping_rules.txt

    CacheCp:
      type: tosca.nodes.nfv.VduCp
      properties:
        layer_protocols: [ ipv4 ]
        protocol:
          - associated_layer_protocol: ipv4
      requirements:
        - virtual_binding: CacheVdu
        - virtual_link: InternalVl

    # ---------------------------------------------------------- web tier: OsContainer realized
    #
    # Declares its container, so its resource requests live in this VNFD rather than in a chart.
    WebVdu:
      type: tosca.nodes.nfv.Vdu.OsContainerDeployableUnit
      properties:
        name: web-vdu
        description: "Web frontend tier, realized MCIO by MCIO through the CISM"
        vdu_profile:
          min_number_of_instances: 2
          max_number_of_instances: 6
        mcio_identification_data:
          name: hybrid-web-cnf2-web
          type: Deployment
        is_num_of_instances_cluster_based: false
      requirements:
        # SOL001 Table 6.8.13.4-1: occurrences [0, UNBOUNDED], hence a list downstream.
        - container: WebContainer

    WebContainer:
      type: tosca.nodes.nfv.Vdu.OsContainer
      properties:
        name: web
        description: "nginx front end"
        # Table 6.8.12.2-1 types the CPU properties as integer (milli-CPU) and the memory ones as
        # scalar-unit.size, so the two are not interchangeable.
        requested_cpu_resources: 250
        cpu_resource_limit: 500
        requested_memory_resources: 128 MiB
        memory_resource_limit: 256 MiB
      artifacts:
        # [ETSI NORMATIVE] SOL001 clause 6.8.12.6: a Vdu.OsContainer shall contain one artifact of
        # type tosca.artifacts.nfv.SwImage, and the node template name fulfils the purpose of the
        # 'id' attribute of the SwImageDesc information element - so this SwImageDesc is
        # "WebContainer", not "sw_image".
        sw_image:
          type: tosca.artifacts.nfv.SwImage
          file: ../Artifacts/Images/web-README.txt
          properties:
            name: nginx
            version: '1.25'
            container_format: docker
            size: 64 MiB

    WebCp:
      type: tosca.nodes.nfv.VduCp
      properties:
        layer_protocols: [ ipv4 ]
        protocol:
          - associated_layer_protocol: ipv4
      requirements:
        - virtual_binding: WebVdu

    # ---------------------------------------------------------------- internal connectivity
    InternalVl:
      type: tosca.nodes.nfv.VnfVirtualLink
      properties:
        connectivity_type:
          layer_protocols: [ ipv4 ]
        description: "Internal link between the web tier and the cache tier"
        vl_profile:
          max_bitrate_requirements:
            root: 1000000
          min_bitrate_requirements:
            root: 100000
